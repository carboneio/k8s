# Default values for carbone-ee.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: carbone/carbone-ee
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: "carbone-ee-production"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: null
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "carbone-ee-user"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Service is set to headless

# This block is for setting up the ingress for more information can be found here: https://kuberkubnetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  annotations:
    ## To be configured at least with : kubernetes.io/ingress.class
  hosts:
    - host: 
      paths:
        - path: /
          pathType: Prefix

  tls: []

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  requests:
    cpu: 1024m
    memory: 2048Mi
    ephemeral-storage: "4Gi"
  limits:
    cpu: 2048m
    memory: 4096Mi
    ephemeral-storage: "10Gi"

# Chrome, used by the HTML rendering engine, allocates its renderer shared memory in /dev/shm.
# A container gets 64Mi there by default, which Chrome exhausts on large documents: the tab dies
# mid-render and the request fails with a protocol or "target closed" error. Mounting a tmpfs of
# our own removes that ceiling.
#
# [!] A `medium: Memory` emptyDir is a tmpfs: whatever Chrome writes in it is charged to the
#     container's memory limit above, on top of the application itself. `size` is only a cap, so
#     nothing is reserved up front, but raise `resources.limits.memory` alongside it if you set a
#     large value, otherwise a heavy render pushes the pod into an OOM kill.
sharedMemory:
  enabled: true
  size: 1Gi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /status
    port: 4000
  initialDelaySeconds: 60
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /status
    port: 4000
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

replicaCount: 4

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 70
  #targetMemoryUtilizationPercentage: 80

applicationConfiguration:
  templateManagement: true
  forceMetadataFetch: true # Force metadata fetch every minutes
  jobBalancer: false
  port: 4000
  # Port of the peer replication WebSocket, used when several pods synchronize their
  # template metadata. No Service and no Ingress exposes it: it is reachable on the pod
  # network only, and restricted by the networkPolicy section below.
  peerPort: 5001
  authentication: false
  authenticationPublicKey:
  studio: true
  studioBasicAuthentication:
  lang: fr
  timezone: Europe/Paris
  timeoutConversion: "60000" # 1min
  nbConvertThread: "1"
  maxInputSize : "62914560" # 60Mo
  nbReportMaxPerBatch: 100
  license: 

persistentStorage:
  # Only one type of persistent Storage should be defined
  persistentVolume:
    enabled: false
    # For multi-instance, volume capacity must be ReadWriteMany
    persistentVolumeClaimName:
    # Template storage is mandatory
    templateFolder: 
    # Should be enable for multiple instance with Studio usage or rendering in two step (?download=false)
    rendersFolder: 
  s3:
    enabled: false
    templatesBucket:
    rendersBucket:
    endpoint:
    region:
    accessKeyId:
    accessKeySecret:
  azureBlobStorage:
    enabled: false
    templatesContainer:
    rendersContainer:
    storageAccount:
    storageKey:

nodeSelector: {}

tolerations: []

affinity: {}

# Security

# Restricts who may reach the pods over the network.
#
# The peer replication port has no authentication of its own: any workload able to open a
# WebSocket on it can register itself as a Carbone peer, receive the template metadata of this
# deployment and be handed rendering jobs queued by its tenants. This policy is what keeps that
# port reachable by the pods of this release only.
#
# It is rendered only when peer replication is actually active, that is when templateManagement
# is enabled together with more than one replica or with autoscaling.
#
# [!] A NetworkPolicy is enforced by the CNI plugin, not by Kubernetes itself. Calico, Cilium
#     and Antrea enforce it; plain Flannel and a few managed offerings ignore it silently, and
#     the policy is then created without protecting anything. Check your cluster's CNI.
networkPolicy:
  enabled: true
  # Extra sources allowed to reach the peer port, on top of the pods of this release. Use it when
  # legitimate peers run in another namespace. Same syntax as a NetworkPolicy `from` entry.
  # peerIngressFrom:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: other-namespace
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: carbone-ee
  peerIngressFrom: []
  # Sources allowed to reach the API port. Empty means every source, which is what happens today
  # without any policy and keeps the ingress controller and the probes working. Narrow it only if
  # you know which workloads call Carbone.
  httpIngressFrom: []

podSecurityContext:
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
